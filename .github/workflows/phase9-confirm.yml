name: Phase 9 materialize implementation

on:
  push:
    branches:
      - phase9-work

permissions:
  contents: write

jobs:
  materialize:
    if: startsWith(github.event.head_commit.message, 'chore: materialize phase9 implementation')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed Phase 9 code
        run: |
          set -euxo pipefail
          python3 .phase9-apply.py
          python3 .phase9-acceptance.py
          git diff --check

      - name: Commit implementation
        run: |
          set -euxo pipefail
          rm -f \
            .phase9-apply.py \
            .phase9-acceptance.py \
            .phase9-result.txt \
            .github/workflows/phase9-confirm.yml
          find . -type f -name '_neutron.mo' -delete

          git config user.name "chatgpt-phase9"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "phase9: implement Sandstorm-style Element installation"
          git push origin HEAD:phase9-work
