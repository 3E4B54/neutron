name: Plasmon CI

on:
  push:
    branches:
      - malstorm-phase1
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: plasmon-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel:
    name: Kernel tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      # Neutron's Motoko packaging scripts expect the Mops CLI to be
      # available on PATH. The local Plasmon development environment has
      # historically installed this manually