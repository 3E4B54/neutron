name: Plasmon CI

on:
  push:
    branches:
      - malstorm-phase1
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: plasmon-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel:
    name: Kernel tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install JavaScript dependencies
        run: npm ci

      # Neutron's Motoko packaging scripts expect the Mops CLI and the
      # kernel's Motoko dependencies to be available. Plasmon's local WSL
      # environment has historically installed Mops separately as well.
      - name: Install Motoko dependencies
        run: |
          npm install --global ic-mops
          cd apps/kernel
          mops install

      # Keep fast regression feedback separate from packaging. Do not run the
      # kernel build as an additional sanity step: `package` below already runs
      # validate -> build -> mopack -> pack, and the build is expensive.
      - name: Run kernel tests
        run: npm --workspace neutron-kernel test

      - name: Package kernel
        run: npm --workspace neutron-kernel run package
