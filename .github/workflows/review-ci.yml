name: Review CI

on:
  push:
    paths:
      - "apps/review/**"
      - "review-local.ndeploy.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/review-ci.yml"
  pull_request:
    paths:
      - "apps/review/**"
      - "review-local.ndeploy.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/review-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-package:
    name: Review semantic + package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test Review package
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm ci
            npm --workspace neutron-review test
          '

  vanilla-browser:
    name: Vanilla Neutron packaged Review
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and run vanilla Review acceptance
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm ci
            npm --workspace neutron-kernel run package
            npm --workspace neutron-design-system run build

            # Review needs the normal Files app for its real File > Open/export
            # boundary. Build a local test package from production VFS sources,
            # but do not invoke Files release-evidence generation from this
            # unrelated Issue lane.
            (
              cd apps/vfs
              npm run validate
              npm run build
              npm run typecheck:clean
              npm run mopack
              npm run schema
              bun ../../packages/neutron-scripts/src/pack.ts
            )

            npm --workspace neutron-review run package

            npm run provision -- review-local.ndeploy.json serve > /tmp/review-pocketic.log 2>&1 &
            server_pid=$!
            trap '\''status=$?; kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat /tmp/review-pocketic.log || true; fi; exit "$status"'\'' EXIT
            for attempt in $(seq 1 45); do
              if npm run provision -- review-local.ndeploy.json status >/dev/null 2>&1; then break; fi
              if [ "$attempt" -eq 45 ]; then echo "PocketIC did not become ready" >&2; exit 1; fi
              sleep 1
            done
            npm run provision -- review-local.ndeploy.json reinstall
            NEUTRON_NDEPLOY_CONFIG=review-local.ndeploy.json npm --workspace neutron-review run test:e2e
          '
