name: Games proof CI

on:
  push:
    branches:
      - agent/games-daedalos-design
  workflow_dispatch:

jobs:
  playable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nix develop --command bash -lc 'set -euxo pipefail; npm ci'

      - name: Package Plasmon
        run: nix develop --command bash -lc 'set -euxo pipefail; npm --workspace neutron-plasmon run package'

      - name: Check packaged proof assets
        run: |
          set -euxo pipefail
          test -s 'apps/plasmon/dist/web/System/Program Files/js-dos/js-dos.js'
          test -s 'apps/plasmon/dist/web/System/Program Files/js-dos/js-dos.css'
          test -s 'apps/plasmon/dist/web/System/Program Files/js-dos/emulators/wdosbox.js'
          test -s 'apps/plasmon/dist/web/System/Program Files/js-dos/emulators/wdosbox.wasm'
          test -s 'apps/plasmon/dist/web/Games/DOS Bundles/Doom.jsdos'

      - name: js-dos association unit tests
        run: nix develop --command bash -lc 'set -euxo pipefail; bun test apps/plasmon/src/native-apps/jsdos/jsdos.test.ts'

      - name: Start packaged Plasmon
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory apps/plasmon/dist/web >/tmp/plasmon-games-http.log 2>&1 &
          echo $! >/tmp/plasmon-games-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/plasmon-games-http.log
          exit 1

      - name: Playable browser smoke
        run: nix develop --command bash -lc 'set -euxo pipefail; npx playwright test test/e2e/plasmon-games-proof.spec.ts --project=chromium --retries=0'
