name: Review lock bootstrap
on:
  push:
    branches: ["work/atoms/58-review-neutron-mvp"]
    paths: ["apps/review/package.json"]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/atoms/58-review-neutron-mvp
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Refresh workspace lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lock if required
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "lock Review workspace dependencies"
          git push origin HEAD:work/atoms/58-review-neutron-mvp
